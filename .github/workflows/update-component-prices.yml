name: Update GPU RAM SSD price CSV

# 07:00-18:00 KST, every hour on the hour.
# GitHub starts scheduled runs hours late, so the schedule below only wakes the runner up.
# The runner stays alive, waits for each hour itself, and re-dispatches this workflow
# before the 6-hour job limit. A run that finds the hour already collected just waits.
on:
  schedule:
    # xx:07 every hour 06:07-17:07 KST (21:07-08:07 UTC), a watchdog in case the chain stopped.
    - cron: "7 0-8,21-23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gpu-ram-ssd-hourly-prices
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Asia/Seoul
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Crawl prices every hour 07:00-18:00 KST
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/run_hourly_component_prices.py --max-minutes 330
