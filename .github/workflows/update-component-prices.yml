name: Update GPU RAM SSD price CSV

on:
  schedule:
    # Hourly 07:00-18:00 KST (22:00-09:00 UTC)
    - cron: "0 0-9,22-23 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Category to crawl"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - gpu
          - ram
          - ssd

permissions:
  contents: write

concurrency:
  # Own group so hourly runs never cancel the queued daily workflows.
  group: danawa-component-prices
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TARGET_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && inputs.category || 'all' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Crawl selected category prices
        run: |
          if [[ "$TARGET_CATEGORY" == "all" ]]; then
            categories=(gpu ram ssd)
          else
            categories=("$TARGET_CATEGORY")
          fi

          args=()
          for category in "${categories[@]}"; do
            args+=(--category "$category")
          done

          python scripts/crawl_danawa.py "${args[@]}" --fail-on-empty --fetcher requests --max-pages 100 --delay 0.1 --skip-combined

          python scripts/update_new_products.py "${args[@]}"

      - name: Commit CSV changes
        run: |
          if [[ "$TARGET_CATEGORY" == "all" ]]; then
            categories=(gpu ram ssd)
            commit_message="Update GPU RAM SSD price CSV"
          else
            categories=("$TARGET_CATEGORY")
            commit_message="Update Danawa ${TARGET_CATEGORY} price CSV"
          fi

          paths=()
          for category in "${categories[@]}"; do
            paths+=("data/latest/${category}.csv" "data/history/${category}_price_history.csv" "data/new_products/${category}.csv" "data/state/known_products/${category}.csv")
          done

          if [[ -n "$(git status --porcelain -- "${paths[@]}")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${paths[@]}"
            git commit -m "$commit_message"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              if [[ $attempt == 5 ]]; then exit 1; fi
              sleep $((attempt * 10))
            done
          else
            echo "No CSV changes"
          fi
