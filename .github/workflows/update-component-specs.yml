name: Update component specs CSV

on:
  schedule:
    # 22:30 UTC = 07:30 KST, after the GPU/RAM/SSD price crawl
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: danawa-data-updates
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Crawl GPU, RAM and SSD specs
        run: |
          for category in gpu ram ssd; do
            python scripts/crawl_component_specs.py --category "$category" --workers 32 --timeout 20 --retries 3
          done

      - name: Commit CSV changes
        run: |
          paths=(data/specs/gpu_specs.csv data/specs/ram_specs.csv data/specs/ssd_specs.csv)
          if [[ -n "$(git status --porcelain -- "${paths[@]}")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${paths[@]}"
            git commit -m "Update component specs CSV"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              if [[ $attempt == 5 ]]; then exit 1; fi
              sleep $((attempt * 10))
            done
          else
            echo "No component specs changes"
          fi
